[project]
name = "pong-dqn"
version = "0.1.0"
description = "Taller 2: resolver Pong (Atari) con Deep Q-Network a partir de pixeles"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Leonar Socarrás Molina", email = "leonarsomo@unisabana.edu.co" },
    { name = "John Jairo Serrano Cifuentes", email = "johnseci@unisabana.edu.co" },
    { name = "Brezhnev Joya Miranda", email = "brezhnevjomi@unisabana.edu.co" },
    { name = "Gabriel Alonso Lizano Alvarado", email = "gabriellial@unisabana.edu.co" },
    { name = "Bryan Johann Aranzazu Medina", email = "bryanarme@unisabana.edu.co" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium[atari]>=1.2.3",
    "opencv-python-headless>=4.9",
    "numpy>=2.0",
    "torch>=2.4",
    "matplotlib>=3.8",
]

[project.scripts]
pong-dqn = "pong_dqn.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pong_dqn"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
